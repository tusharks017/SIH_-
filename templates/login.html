{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow mt-5 border-0" style="border-radius: 15px;">
            <div class="card-body p-5">
                <div class="text-center mb-5">
                    <div class="bg-primary bg-opacity-10 rounded-circle d-inline-block p-4 mb-3">
                        <i class="bi bi-person-circle text-primary" style="font-size: 3rem;"></i>
                    </div>
                    <h3 class="fw-bold">{{ _('Welcome Back') }}</h3>
                    <p class="text-muted">{{ _('Login to access your documents') }}</p>
                </div>
                
                <form method="POST" data-validate>
                    <div class="form-floating mb-4">
                        <input type="text" class="form-control border-light shadow-none bg-light"
                               id="username" name="username" placeholder="Username" required
                               autocomplete="username">
                        <label for="username" class="text-muted">{{ _('Username') }}</label>
                        <div class="invalid-feedback">Username is required.</div>
                    </div>

                    <div class="form-floating mb-5">
                        <div class="password-wrapper">
                            <input type="password" class="form-control border-light shadow-none bg-light"
                                   id="password" name="password" placeholder="Password" required
                                   autocomplete="current-password" style="height:58px;">
                            <button type="button" class="password-toggle" tabindex="-1" aria-label="Toggle password visibility">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <div class="invalid-feedback">Password is required.</div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill shadow">
                        <i class="bi bi-box-arrow-in-right"></i> {{ _('Login') }}
                    </button>
                </form>

                <div class="mt-4 text-center">
                    <p class="text-muted">{{ _("Don't have an account?") }}
                        <a href="{{ url_for('register') }}" class="text-primary text-decoration-none fw-bold">{{ _('Register here') }}</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
